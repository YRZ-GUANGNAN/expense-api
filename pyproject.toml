[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "ASYNC", "LOG"]
ignore = [
    "B008",    # FastAPI 的 Depends/Query 作为默认值是官方写法
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S101", "S105"]   # pytest 用 assert；测试密码是固定值
"client_demo.py" = ["S113"]      # 本地演示脚本，不必强制 timeout
"config.example.py" = ["S105"]   # 模板里本来就是占位值
