name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: learn_db
          MYSQL_USER: learn
          MYSQL_PASSWORD: learnpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -prootpass"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: learn
      DB_PASSWORD: learnpass
      DB_NAME: learn_db
      JWT_SECRET: ci-test-secret-at-least-32-bytes-long

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: 代码检查
        run: ruff check .

      - name: 执行数据库迁移
        run: alembic upgrade head

      - name: 运行测试
        run: pytest -q
