services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: learn_db
      MYSQL_USER: learn
      MYSQL_PASSWORD: learnpass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    ports:
      - "8002:8000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: learn
      DB_PASSWORD: learnpass
      DB_NAME: learn_db
      JWT_SECRET: compose-dev-secret-change-me
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python setup_db.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  db_data: